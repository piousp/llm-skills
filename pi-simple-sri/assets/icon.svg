<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#0E1726"/>
  <circle cx="600" cy="375" r="420" fill="#12202F"/>

  <!-- loop: one turn around the skill, arrow pointing back up -->
  <path d="M600 90 A285 285 0 1 1 315 375" fill="none" stroke="#19C7D4" stroke-width="18" stroke-linecap="round"/>
  <polygon points="315,331 287,385 343,385" fill="#19C7D4"/>

  <!-- the skill file -->
  <rect x="470" y="165" width="260" height="420" rx="26" fill="#0B1220" stroke="#2F7C93" stroke-width="14"/>

  <!-- frontmatter: name, description -->
  <g fill="#2F7C93">
    <rect x="506" y="211" width="120" height="18" rx="9"/>
    <rect x="506" y="245" width="188" height="18" rx="9"/>
  </g>
  <line x1="506" y1="295" x2="694" y2="295" stroke="#2F7C93" stroke-width="10"/>

  <!-- body: instructions already in the skill -->
  <g fill="#1C3348">
    <rect x="506" y="329" width="168" height="16" rx="8"/>
    <rect x="506" y="361" width="132" height="16" rx="8"/>
    <rect x="506" y="393" width="152" height="16" rx="8"/>
  </g>

  <!-- the new lesson, marked as an insertion -->
  <rect x="492" y="437" width="216" height="60" rx="12" fill="#19C7D4" opacity="0.16"/>
  <rect x="492" y="437" width="8" height="60" rx="4" fill="#19C7D4"/>
  <g fill="#19C7D4">
    <rect x="520" y="455" width="150" height="16" rx="8"/>
    <rect x="520" y="481" width="96" height="16" rx="8"/>
  </g>

  <!-- the lesson is an insertion into the skill -->
  <g stroke="#19C7D4" stroke-width="12" stroke-linecap="round">
    <line x1="776" y1="467" x2="816" y2="467"/>
    <line x1="796" y1="447" x2="796" y2="487"/>
  </g>
</svg>
